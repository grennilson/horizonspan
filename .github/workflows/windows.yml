name: Windows build and checks
on:
  push:
    paths: ['Windows/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['Windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check model download integrity and cache handling
        run: python Windows/Tests/check_model_downloads.py
      - name: Build and test Windows app and standalone installer
        shell: pwsh
        run: ./Windows/build.ps1
      - name: Keep checked executables and reports
        uses: actions/upload-artifact@v4
        with:
          name: ScreenSpan-Wallpaper-Windows-1.0.1
          path: Windows/artifacts/
          if-no-files-found: error
